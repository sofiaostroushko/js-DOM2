
<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>LUMI | Photo Gallery</title>

  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>

<body>
  <main class="container">

    <header class="header">
      <p class="subtitle">YOUR LITTLE SPACE FOR INSPIRATION</p>

      <h1>LUMI<span>.</span></h1>

      <p class="description">
        Колекція випадкових моментів, які варто побачити.
      </p>
    </header>


    <section class="gallery-section">

      <div class="gallery-info">
        <h2>Photo collection</h2>
        <span id="photoCount">0 фотографій</span>
      </div>


      <div id="gallery" class="gallery"></div>

      <p id="message" class="message"
         role="status" aria-live="polite"></p>

      <div class="controls">

        <button id="loadBtn" class="btn btn-primary">
          + Завантажити ще 4
        </button>

        <button id="clearBtn" class="btn">
          Очистити галерею
        </button>

        <button id="removeBtn" class="btn">
          Видалити останню
        </button>

        <button id="reverseBtn" class="btn">
          Перевернути галерею
        </button>

      </div>
    </section>

    <footer class="footer">
      <p>LUMI GALLERY © 2026</p>
      <p>Made with creativity & JavaScript</p>
    </footer>

  </main>
</body>
</html>
